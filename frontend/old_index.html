<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bautro Optical Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #F5F2EC;
      --surface:   #FDFBF7;
      --surface2:  #EDE9E0;
      --border:    #D9D3C7;
      --text:      #1C1A17;
      --text-2:    #6B6456;
      --text-3:    #9C9283;
      --accent:    #2B5F8E;
      --accent-lt: #EBF2FA;
      --accent-dk: #1A3D5C;
      --green:     #2E7D5A;
      --green-lt:  #EBF5F0;
      --red:       #C0392B;
      --red-lt:    #FDECEA;
      --amber:     #B7640A;
      --amber-lt:  #FEF3E2;
      --radius:    10px;
      --shadow:    0 2px 12px rgba(28,26,23,0.08);
      --shadow-lg: 0 8px 32px rgba(28,26,23,0.13);
      --font-serif: 'DM Serif Display', Georgia, serif;
      --font-sans:  'DM Sans', system-ui, sans-serif;
    }

    html, body { height: 100%; background: var(--bg); font-family: var(--font-sans); color: var(--text); font-size: 14px; line-height: 1.5; }

    /* ── LAYOUT ── */
    #root { display: flex; height: 100vh; overflow: hidden; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 220px; flex-shrink: 0;
      background: var(--text); color: #E8E4DC;
      display: flex; flex-direction: column;
      padding: 0 0 16px 0;
    }
    .sidebar-brand {
      padding: 24px 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-brand h1 {
      font-family: var(--font-serif); font-size: 18px; color: #F5F2EC; letter-spacing: -.3px; line-height: 1.2;
    }
    .sidebar-brand span { font-family: var(--font-sans); font-size: 11px; color: var(--text-3); font-weight: 400; display: block; margin-top: 2px; letter-spacing: .5px; text-transform: uppercase; }
    .sidebar-nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 7px; cursor: pointer;
      font-size: 13.5px; font-weight: 500; color: #A89E8E;
      transition: background .15s, color .15s;
      user-select: none;
    }
    .nav-item:hover { background: rgba(255,255,255,0.06); color: #E8E4DC; }
    .nav-item.active { background: var(--accent); color: #fff; }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .sidebar-footer { padding: 0 16px; font-size: 11px; color: var(--text-3); }

    /* ── MAIN ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── TOPBAR ── */
    .topbar {
      height: 56px; flex-shrink: 0;
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
    }
    .topbar-left { display: flex; flex-direction: column; }
    .topbar-title { font-family: var(--font-serif); font-size: 20px; letter-spacing: -.2px; }
    .topbar-sub { font-size: 11.5px; color: var(--text-2); }
    .topbar-right { display: flex; align-items: center; gap: 10px; }

    /* ── CONTENT ── */
    .content { flex: 1; overflow-y: auto; padding: 24px 28px; }

    /* ── CARDS / STAT TILES ── */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 16px;
      box-shadow: var(--shadow);
    }
    .stat-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--text-2); margin-bottom: 6px; }
    .stat-card .value { font-family: var(--font-serif); font-size: 30px; color: var(--text); line-height: 1; }
    .stat-card .sub { font-size: 11.5px; color: var(--text-3); margin-top: 4px; }
    .stat-card.accent { background: var(--accent); border-color: var(--accent-dk); }
    .stat-card.accent .label, .stat-card.accent .sub { color: rgba(255,255,255,.65); }
    .stat-card.accent .value { color: #fff; }
    .stat-card.green { background: var(--green); border-color: #1f5e3f; }
    .stat-card.green .label, .stat-card.green .sub { color: rgba(255,255,255,.65); }
    .stat-card.green .value { color: #fff; }

    /* ── TABLE ── */
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .table-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .table-header h3 { font-family: var(--font-serif); font-size: 16px; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      background: var(--surface2); padding: 10px 14px;
      text-align: left; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .6px; color: var(--text-2);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; cursor: pointer; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--accent-lt); }
    tbody td { padding: 11px 14px; color: var(--text); white-space: nowrap; }
    tbody td.muted { color: var(--text-2); }
    .empty-row td { text-align: center; color: var(--text-3); padding: 32px; font-style: italic; cursor: default; }
    .empty-row:hover { background: transparent !important; }

    /* ── BADGES ── */
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; letter-spacing: .2px; }
    .badge-green { background: var(--green-lt); color: var(--green); }
    .badge-red   { background: var(--red-lt);   color: var(--red); }
    .badge-amber { background: var(--amber-lt);  color: var(--amber); }
    .badge-blue  { background: var(--accent-lt); color: var(--accent); }
    .badge-gray  { background: var(--surface2);  color: var(--text-2); }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500;
      border: 1px solid transparent; cursor: pointer; transition: all .15s;
      font-family: var(--font-sans); white-space: nowrap;
    }
    .btn svg { width: 14px; height: 14px; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent-dk); }
    .btn-primary:hover { background: var(--accent-dk); }
    .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: var(--surface2); }
    .btn-danger { background: var(--red-lt); color: var(--red); border-color: #f5b7b1; }
    .btn-danger:hover { background: #fad7d3; }
    .btn-sm { padding: 5px 11px; font-size: 12px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── SEARCH ── */
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-3); pointer-events: none; }
    .search-input { padding: 7px 10px 7px 32px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; font-family: var(--font-sans); background: var(--surface); color: var(--text); outline: none; width: 220px; }
    .search-input:focus { border-color: var(--accent); }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(28,26,23,.45); backdrop-filter: blur(3px);
      z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;
      animation: fadeIn .15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg);
      width: 100%; max-width: 680px; max-height: 90vh; display: flex; flex-direction: column;
      animation: slideUp .2s ease;
    }
    .modal-lg { max-width: 860px; }
    @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-head {
      padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-head h2 { font-family: var(--font-serif); font-size: 20px; }
    .modal-head p { font-size: 12.5px; color: var(--text-2); margin-top: 1px; }
    .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
    .modal-foot { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
    .close-btn { background: none; border: none; cursor: pointer; color: var(--text-3); padding: 4px; border-radius: 4px; display: flex; }
    .close-btn:hover { background: var(--surface2); color: var(--text); }
    .close-btn svg { width: 18px; height: 18px; }

    /* ── FORMS ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    .form-grid.cols-1 { grid-template-columns: 1fr; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.span-2 { grid-column: span 2; }
    .form-group.span-3 { grid-column: span 3; }
    label { font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .5px; }
    input, select, textarea {
      padding: 8px 11px; border: 1px solid var(--border); border-radius: 7px;
      font-size: 13.5px; font-family: var(--font-sans); background: var(--bg);
      color: var(--text); outline: none; transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); background: var(--surface); }
    textarea { resize: vertical; min-height: 72px; }
    .form-section { margin: 20px 0 10px; }
    .form-section h4 { font-family: var(--font-serif); font-size: 15px; color: var(--text); padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .rx-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
    .rx-table th { background: var(--surface2); padding: 7px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-2); border: 1px solid var(--border); }
    .rx-table td { padding: 4px 6px; border: 1px solid var(--border); }
    .rx-table input { border: none; background: transparent; padding: 6px 8px; width: 100%; font-size: 13px; }
    .rx-table input:focus { background: var(--accent-lt); outline: none; border-radius: 4px; }

    /* ── TOAST ── */
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: var(--text); color: #F5F2EC; padding: 11px 16px; border-radius: 9px;
      font-size: 13px; max-width: 320px; box-shadow: var(--shadow-lg);
      display: flex; align-items: center; gap: 8px;
      animation: toastIn .25s ease;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .toast.success { background: var(--green); }
    .toast.error   { background: var(--red); }

    /* ── DETAIL PANEL ── */
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; }
    .detail-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    .detail-item label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-3); display: block; margin-bottom: 1px; }
    .detail-item span { font-size: 13.5px; color: var(--text); }
    .detail-item span.empty { color: var(--text-3); font-style: italic; }
    .section-divider { margin: 16px 0; border: none; border-top: 1px solid var(--border); }

    /* ── LOADING ── */
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; color: var(--text-2); }

    /* ── MISC ── */
    .page-section { margin-bottom: 28px; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .ml-auto { margin-left: auto; }
    .mt-2 { margin-top: 8px; }
    .alert { padding: 12px 16px; border-radius: var(--radius); font-size: 13px; margin-bottom: 16px; }
    .alert-amber { background: var(--amber-lt); color: var(--amber); border: 1px solid #f5d9a8; }
    .alert-red   { background: var(--red-lt); color: var(--red); border: 1px solid #f5b7b1; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  </style>
</head>
<body>
<div id="root"></div>

<script>
/* ─────────────────────────────────────────────
   CONFIG
───────────────────────────────────────────── */
const API = 'http://localhost:8000';

/* ─────────────────────────────────────────────
   HELPERS
───────────────────────────────────────────── */
async function apiFetch(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || `HTTP ${res.status}`);
  }
  return res.json();
}

function fmt(val) {
  if (val === null || val === undefined || val === '') return '—';
  return val;
}
function fmtMoney(val) {
  if (val === null || val === undefined) return '—';
  return '₱' + parseFloat(val).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(val) {
  if (!val) return '—';
  return val;
}

let toastId = 0;
const toasts = [];
function toast(msg, type = 'success') {
  const id = ++toastId;
  toasts.push({ id, msg, type });
  renderApp();
  setTimeout(() => {
    const i = toasts.findIndex(t => t.id === id);
    if (i !== -1) toasts.splice(i, 1);
    renderApp();
  }, 3200);
}

/* ─────────────────────────────────────────────
   STATE
───────────────────────────────────────────── */
let state = {
  page: 'dashboard',
  dashboard: null,
  patients: null,
  prescriptions: null,
  inventory: null,
  billing: null,
  modal: null,      // { type, data? }
  loading: {},
  search: { patients: '', inventory: '', billing: '', prescriptions: '' }
};

function setState(patch) {
  Object.assign(state, patch);
  renderApp();
}

/* ─────────────────────────────────────────────
   DATA LOADERS
───────────────────────────────────────────── */
async function loadDashboard() {
  if (state.loading.dashboard) return;

  setState({
    loading: { ...state.loading, dashboard: true }
  });

  try {
    const data = await apiFetch('/dashboard/');

    console.log('Dashboard data:', data);

    setState({
      dashboard: data,
      loading: { ...state.loading, dashboard: false }
    });

  } catch (e) {
    console.error('Dashboard error:', e);

    setState({
      loading: { ...state.loading, dashboard: false }
    });

    toast('Failed to load dashboard: ' + e.message, 'error');
  }
}

async function loadPatients() {
  if (state.loading.patients) return;
  setState({ loading: { ...state.loading, patients: true } });
  try {
    const rows = await apiFetch('/patients/');
    // rows[0] is header row
    const headers = rows[0] || [];
    const data = rows.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h, r[i]])));
    setState({ patients: data, loading: { ...state.loading, patients: false } });
  } catch (e) {
    setState({ loading: { ...state.loading, patients: false } });
    toast('Failed to load patients: ' + e.message, 'error');
  }
}

async function loadPrescriptions() {
  if (state.loading.prescriptions) return;
  setState({ loading: { ...state.loading, prescriptions: true } });
  try {
    const rows = await apiFetch('/prescriptions/');
    const headers = rows[0] || [];
    const data = rows.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h, r[i]])));
    setState({ prescriptions: data, loading: { ...state.loading, prescriptions: false } });
  } catch (e) {
    setState({ loading: { ...state.loading, prescriptions: false } });
    toast('Failed to load prescriptions: ' + e.message, 'error');
  }
}

async function loadInventory() {
  if (state.loading.inventory) return;
  setState({ loading: { ...state.loading, inventory: true } });
  try {
    const rows = await apiFetch('/inventory/');
    const headers = rows[0] || [];
    const data = rows.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h, r[i]])));
    setState({ inventory: data, loading: { ...state.loading, inventory: false } });
  } catch (e) {
    setState({ loading: { ...state.loading, inventory: false } });
    toast('Failed to load inventory: ' + e.message, 'error');
  }
}

async function loadBilling() {
  if (state.loading.billing) return;
  setState({ loading: { ...state.loading, billing: true } });
  try {
    const rows = await apiFetch('/billing/');
    const headers = rows[0] || [];
    const data = rows.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h, r[i]])));
    setState({ billing: data, loading: { ...state.loading, billing: false } });
  } catch (e) {
    setState({ loading: { ...state.loading, billing: false } });
    toast('Failed to load billing: ' + e.message, 'error');
  }
}

/* ─────────────────────────────────────────────
   SVG ICONS
───────────────────────────────────────────── */
const icons = {
  dashboard: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>`,
  patients:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  rx:        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l3 3 5-7"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>`,
  inventory: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`,
  billing:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>`,
  plus:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  search:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  close:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  eye:       `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,
  refresh:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  warn:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  edit:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
};

/* ─────────────────────────────────────────────
   RENDER ENGINE (vanilla DOM builder)
───────────────────────────────────────────── */
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node[k] = v;
    else node.setAttribute(k, v);
  }
  for (const child of children.flat()) {
    if (child == null) continue;
    if (typeof child === 'string' || typeof child === 'number') node.append(child);
    else node.appendChild(child);
  }
  return node;
}

function html(str) {
  const div = document.createElement('div');
  div.innerHTML = str;
  return Array.from(div.childNodes);
}

/* ─────────────────────────────────────────────
   MODAL BUILDERS
───────────────────────────────────────────── */
function buildModal(title, subtitle, content, footer, large = false) {
  const overlay = el('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay) closeModal(); } });
  const modal = el('div', { class: large ? 'modal modal-lg' : 'modal' });

  const headLeft = el('div', {});
  headLeft.innerHTML = `<h2>${title}</h2>${subtitle ? `<p>${subtitle}</p>` : ''}`;

  const closeBtn = el('button', { class: 'close-btn', onclick: closeModal });
  closeBtn.innerHTML = icons.close;

  const head = el('div', { class: 'modal-head' }, headLeft, closeBtn);
  const body = el('div', { class: 'modal-body' }, content);
  const foot = el('div', { class: 'modal-foot' }, ...footer);

  modal.append(head, body, foot);
  overlay.appendChild(modal);
  return overlay;
}

function closeModal() {
  setState({ modal: null });
}

function renderDashboard() {
  if (!state.dashboard) {

  const stats = [
    { label: 'Total Patients', value: d.total_patients, sub: 'registered', cls: 'accent' },
    { label: 'Prescriptions', value: d.total_prescriptions, sub: 'on record', cls: '' },

async function submitAddPatient() {
  const g = id => document.getElementById(id)?.value.trim() || null;
  const full_name = g('f_full_name');
  const contact_number = g('f_contact_number');
  if (!full_name || !contact_number) { toast('Full name and contact number are required', 'error'); return; }

  const payload = {
    full_name, contact_number,
    address: g('f_address'), date_of_birth: g('f_date_of_birth'),
    age: g('f_age') ? parseInt(g('f_age')) : null,
    sex: g('f_sex'), occupation: g('f_occupation'), emergency_contact: g('f_emergency_contact'),
    chief_complaint: g('f_chief_complaint'), medical_history: g('f_medical_history'),
    ocular_history: g('f_ocular_history'), allergies: g('f_allergies'),
    current_medications: g('f_current_medications'),
    visual_acuity_od: g('f_visual_acuity_od'), visual_acuity_os: g('f_visual_acuity_os'),
    bcva_od: g('f_bcva_od'), bcva_os: g('f_bcva_os'), iop: g('f_iop'),
    diagnosis: g('f_diagnosis'), clinical_notes: g('f_clinical_notes'), other_tests: g('f_other_tests'),
  };

  try {
    const res = await apiFetch('/patients/', { method: 'POST', body: JSON.stringify(payload) });
    closeModal();
    toast(`Patient ${res.patient_number} created successfully`);
    setState({ patients: null, dashboard: null });
    loadPatients();
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  }
}

          <td style="padding:8px 12px">${fmt(r.os_sphere)}</td><td style="padding:8px 12px">${fmt(r.os_cylinder)}</td>
          <td style="padding:8px 12px">${fmt(r.os_axis)}</td><td style="padding:8px 12px">${fmt(r.os_add)}</td>
        </tr>
      </tbody>
    </table>
    <div class="detail-grid">
      ${dv('Distance PD', r.distance_pd)} ${dv('Near PD', r.near_pd)}
      ${dv('Right Seg Height', r.right_seg_height)} ${dv('Left Seg Height', r.left_seg_height)}
      ${dv('Right Pupil Height', r.right_pupil_height)} ${dv('Left Pupil Height', r.left_pupil_height)}
    </div>
    <hr class="section-divider">
    <div class="detail-grid">
      ${dv('Lens Type', r.lens_type)} ${dv('Lens Brand', r.lens_brand)}
      ${dv('Lens Coating', r.lens_coating)} ${dv('Tint', r.tint)}
      ${dv('Frame Brand', r.frame_brand)} ${dv('Frame Model', r.frame_model)}
    </div>
    <div class="detail-grid cols-1" style="margin-top:10px">${dv('Special Instructions', r.special_instructions)}</div>
  `;

  const closeBtn = el('button', { class: 'btn btn-secondary', onclick: closeModal }, 'Close');
  setState({ modal: buildModal('Prescription Details', r.prescription_number, content, [closeBtn], true) });
}

/* ─────────────────────────────────────────────
   PAGE: INVENTORY
───────────────────────────────────────────── */
function renderInventory() {
  if (!state.inventory) { loadInventory(); return el('div', { class: 'loading-state' }, el('div', { class: 'spinner' }), 'Loading inventory…'); }

  const q = state.search.inventory.toLowerCase();
  const rows = state.inventory.filter(r =>
    !q || (r.item_code||'').toLowerCase().includes(q) || (r.brand||'').toLowerCase().includes(q)
    || (r.model||'').toLowerCase().includes(q) || (r.category||'').toLowerCase().includes(q)
  );

  const wrap = el('div', {});
  const tbl = el('div', { class: 'table-wrap' });

  const th = el('div', { class: 'table-header' });
  const searchWrap = el('div', { class: 'search-wrap' });
  searchWrap.innerHTML = icons.search;
  const inp = el('input', { class: 'search-input', placeholder: 'Search inventory…', value: state.search.inventory });
  inp.oninput = (e) => { state.search.inventory = e.target.value; renderApp(); };
  searchWrap.appendChild(inp);

  const addBtn = el('button', { class: 'btn btn-primary btn-sm', onclick: openAddInventory });
  addBtn.innerHTML = icons.plus + ' Add Item';

  th.innerHTML = '<h3>Inventory</h3>';
  th.append(searchWrap, addBtn);

  const scroll = el('div', { class: 'table-scroll' });
  const table = el('table', {});
  table.innerHTML = `<thead><tr>
    <th>Item Code</th><th>Category</th><th>Brand</th><th>Model</th><th>Color</th>
    <th>Supplier</th><th>Cost</th><th>Selling Price</th><th>Qty</th><th>Reorder</th><th></th>
  </tr></thead>`;
  const tbody = el('tbody', {});

  if (rows.length === 0) {
    const tr = el('tr', { class: 'empty-row' });
    tr.innerHTML = `<td colspan="11">No items found</td>`;
    tbody.appendChild(tr);
  } else {
    for (const r of rows) {
      const qty = parseInt(r.quantity) || 0;
      const reorder = parseInt(r.reorder_level) || 0;
      const lowStock = qty <= reorder;
      const tr = el('tr', { onclick: () => openViewInventory(r) });
      tr.innerHTML = `
        <td><span class="badge badge-blue">${fmt(r.item_code)}</span></td>
        <td class="muted">${fmt(r.category)}</td>
        <td><strong>${fmt(r.brand)}</strong></td>
        <td class="muted">${fmt(r.model)}</td>
        <td class="muted">${fmt(r.color)}</td>
        <td class="muted">${fmt(r.supplier)}</td>
        <td class="muted">${fmtMoney(r.purchase_cost)}</td>
        <td>${fmtMoney(r.selling_price)}</td>
        <td><span class="badge ${lowStock ? 'badge-red' : 'badge-green'}">${fmt(r.quantity)}</span></td>
        <td class="muted">${fmt(r.reorder_level)}</td>
        <td><button class="btn btn-secondary btn-sm">Manage</button></td>
      `;
      tbody.appendChild(tr);
    }
  }

  table.appendChild(tbody);
  scroll.appendChild(table);
  tbl.append(th, scroll);
  wrap.appendChild(tbl);
  return wrap;
}

function openAddInventory() {
  const form = el('div', {});
  form.innerHTML = `
    <div class="form-grid">
      <div class="form-group">
        <label>Category *</label>
        <select id="inv_category">
          <option value="">Select category</option>
          <option>Frames</option><option>Lenses</option><option>Sunglasses</option>
          <option>Contact Lenses</option><option>Accessories</option><option>Other</option>
        </select>
      </div>
      <div class="form-group"><label>Brand *</label><input id="inv_brand" placeholder="Oakley, Ray-Ban…" /></div>
      <div class="form-group"><label>Model *</label><input id="inv_model" /></div>
      <div class="form-group"><label>Color *</label><input id="inv_color" placeholder="Black, Gold…" /></div>
      <div class="form-group span-2"><label>Supplier</label><input id="inv_supplier" /></div>
      <div class="form-group"><label>Purchase Cost (₱) *</label><input id="inv_purchase_cost" type="number" step="0.01" min="0" placeholder="0.00" /></div>
      <div class="form-group"><label>Selling Price (₱) *</label><input id="inv_selling_price" type="number" step="0.01" min="0" placeholder="0.00" /></div>
      <div class="form-group"><label>Initial Quantity *</label><input id="inv_quantity" type="number" min="0" placeholder="0" /></div>
      <div class="form-group"><label>Reorder Level *</label><input id="inv_reorder_level" type="number" min="0" placeholder="5" /></div>
    </div>
  `;

  const cancelBtn = el('button', { class: 'btn btn-secondary', onclick: closeModal }, 'Cancel');
  const saveBtn = el('button', { class: 'btn btn-primary', onclick: submitAddInventory }, 'Add Item');

  setState({ modal: buildModal('Add Inventory Item', 'Add a new product to inventory', form, [cancelBtn, saveBtn]) });
}

async function submitAddInventory() {
  const g = id => document.getElementById(id)?.value.trim() || null;
  const required = ['inv_category','inv_brand','inv_model','inv_color','inv_purchase_cost','inv_selling_price','inv_quantity','inv_reorder_level'];
  for (const id of required) {
    if (!g(id)) { toast('Please fill in all required fields', 'error'); return; }
  }

  const payload = {
    category: g('inv_category'), brand: g('inv_brand'), model: g('inv_model'), color: g('inv_color'),
    supplier: g('inv_supplier') || '', purchase_cost: parseFloat(g('inv_purchase_cost')),
    selling_price: parseFloat(g('inv_selling_price')), quantity: parseInt(g('inv_quantity')),
    reorder_level: parseInt(g('inv_reorder_level')),
  };

  try {
    const res = await apiFetch('/inventory/', { method: 'POST', body: JSON.stringify(payload) });
    closeModal();
    toast(`Item ${res.item_code} added to inventory`);
    setState({ inventory: null, dashboard: null });
    loadInventory();
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  }
}

function openViewInventory(r) {
  const dv = (label, val) => `<div class="detail-item"><label>${label}</label><span class="${!val||val===''?'empty':''}">${fmt(val)}</span></div>`;
  const qty = parseInt(r.quantity) || 0;
  const reorder = parseInt(r.reorder_level) || 0;
  const lowStock = qty <= reorder;

  const content = el('div', {});
  content.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <div>
        <div style="font-family:var(--font-serif);font-size:20px">${fmt(r.brand)} ${fmt(r.model)}</div>
        <div style="font-size:12px;color:var(--text-2)">${fmt(r.item_code)} · ${fmt(r.category)} · ${fmt(r.color)}</div>
      </div>
      <div style="margin-left:auto">
        <span class="badge ${lowStock ? 'badge-red' : 'badge-green'}" style="font-size:14px;padding:4px 12px">${qty} in stock</span>
      </div>
    </div>
    <div class="detail-grid">
      ${dv('Supplier', r.supplier)} ${dv('Reorder Level', r.reorder_level)}
      ${dv('Purchase Cost', fmtMoney(r.purchase_cost))} ${dv('Selling Price', fmtMoney(r.selling_price))}
    </div>
    <hr class="section-divider">
    <div style="font-size:13px;font-weight:600;margin-bottom:10px">Adjust Stock</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Action</label>
        <select id="inv_action">
          <option value="RESTOCK">Restock (+)</option>
          <option value="ADJUSTMENT">Adjustment (±)</option>
          <option value="DAMAGED">Damaged / Write-off (-)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Quantity Change</label>
        <input id="inv_qty_change" type="number" placeholder="e.g. 10 or -5" />
      </div>
      <div class="form-group span-2">
        <label>Remarks</label>
        <input id="inv_remarks" placeholder="Optional note" />
      </div>
    </div>
  `;

  const closeBtn = el('button', { class: 'btn btn-secondary', onclick: closeModal }, 'Close');
  const updateBtn = el('button', { class: 'btn btn-primary', onclick: () => submitUpdateQty(r.item_code) }, 'Update Stock');

  setState({ modal: buildModal('Manage Inventory Item', r.item_code, content, [closeBtn, updateBtn]) });
}

async function submitUpdateQty(item_code) {
  const qty_change = parseInt(document.getElementById('inv_qty_change')?.value);
  const action = document.getElementById('inv_action')?.value;
  const remarks = document.getElementById('inv_remarks')?.value || '';

  if (isNaN(qty_change) || qty_change === 0) { toast('Enter a valid quantity change', 'error'); return; }

  try {
    const res = await apiFetch(`/inventory/${item_code}/quantity`, {
      method: 'PATCH',
      body: JSON.stringify({ quantity_change: qty_change, action, remarks }),
    });
    closeModal();
    toast(`Stock updated. New quantity: ${res.new_quantity}`);
    setState({ inventory: null, dashboard: null });
    loadInventory();
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  }
}

/* ─────────────────────────────────────────────
   PAGE: BILLING
───────────────────────────────────────────── */
function renderBilling() {
  if (!state.billing) { loadBilling(); return el('div', { class: 'loading-state' }, el('div', { class: 'spinner' }), 'Loading billing…'); }

  const q = state.search.billing.toLowerCase();
  const rows = state.billing.filter(r =>
    !q || (r.invoice_number||'').toLowerCase().includes(q) || (r.patient_number||'').toLowerCase().includes(q)
    || (r.product_code||'').toLowerCase().includes(q)
  );

  const wrap = el('div', {});
  const tbl = el('div', { class: 'table-wrap' });

  const th = el('div', { class: 'table-header' });
  const searchWrap = el('div', { class: 'search-wrap' });
  searchWrap.innerHTML = icons.search;
  const inp = el('input', { class: 'search-input', placeholder: 'Search invoices…', value: state.search.billing });
  inp.oninput = (e) => { state.search.billing = e.target.value; renderApp(); };
  searchWrap.appendChild(inp);

  const addBtn = el('button', { class: 'btn btn-primary btn-sm', onclick: openAddInvoice });
  addBtn.innerHTML = icons.plus + ' New Invoice';

  th.innerHTML = '<h3>Billing & Invoices</h3>';
  th.append(searchWrap, addBtn);

  const scroll = el('div', { class: 'table-scroll' });
  const table = el('table', {});
  table.innerHTML = `<thead><tr>
    <th>Invoice #</th><th>Patient #</th><th>Product Code</th>
    <th>Qty</th><th>Unit Price</th><th>Total</th><th>Payment</th><th>Date</th>
  </tr></thead>`;
  const tbody = el('tbody', {});

  if (rows.length === 0) {
    const tr = el('tr', { class: 'empty-row' });
    tr.innerHTML = `<td colspan="8">No invoices found</td>`;
    tbody.appendChild(tr);
  } else {
    let grandTotal = 0;
    for (const r of rows) {
      const total = parseFloat(r.total) || 0;
      grandTotal += total;
      const method = (r.payment_method||'').toLowerCase();
      const badgeCls = method === 'cash' ? 'badge-green' : method === 'gcash' || method === 'maya' ? 'badge-blue' : 'badge-gray';
      const tr = el('tr', {});
      tr.innerHTML = `
        <td><span class="badge badge-blue">${fmt(r.invoice_number)}</span></td>
        <td><span class="badge badge-gray">${fmt(r.patient_number)}</span></td>
        <td class="muted">${fmt(r.product_code)}</td>
        <td class="muted">${fmt(r.quantity)}</td>
        <td class="muted">${fmtMoney(r.unit_price)}</td>
        <td><strong>${fmtMoney(r.total)}</strong></td>
        <td><span class="badge ${badgeCls}">${fmt(r.payment_method)}</span></td>
        <td class="muted">${fmtDate(r.date)}</td>
      `;
      tbody.appendChild(tr);
    }
    // totals row
    if (rows.length > 0 && q) {
      const tr = el('tr', { style: 'background:var(--surface2)' });
      tr.innerHTML = `<td colspan="5" style="text-align:right;font-weight:600;color:var(--text-2);font-size:12px;letter-spacing:.5px;text-transform:uppercase">Filtered Total</td>
        <td><strong style="color:var(--green)">${fmtMoney(grandTotal)}</strong></td><td colspan="2"></td>`;
      tbody.appendChild(tr);
    }
  }

  table.appendChild(tbody);
  scroll.appendChild(table);
  tbl.append(th, scroll);
  wrap.appendChild(tbl);
  return wrap;
}

function openAddInvoice() {
  const form = el('div', {});

  // Populate product dropdown from inventory if loaded
  let productOptions = '<option value="">Type item code or select…</option>';
  if (state.inventory) {
    for (const item of state.inventory) {
      productOptions += `<option value="${item.item_code}" data-price="${item.selling_price}">${item.item_code} — ${item.brand} ${item.model} (${fmtMoney(item.selling_price)})</option>`;
    }
  }

  form.innerHTML = `
    <div class="form-grid">
      <div class="form-group"><label>Patient Number *</label><input id="bill_patient_number" placeholder="P-00001" /></div>
      <div class="form-group"><label>Payment Method *</label>
        <select id="bill_payment_method">
          <option value="">Select method</option>
          <option>Cash</option><option>GCash</option><option>Maya</option>
          <option>Credit Card</option><option>Debit Card</option><option>Check</option>
        </select>
      </div>
      <div class="form-group span-2"><label>Product Code *</label>
        <select id="bill_product_code" onchange="onProductSelect()">${productOptions}</select>
      </div>
      <div class="form-group"><label>Quantity *</label><input id="bill_quantity" type="number" min="1" value="1" oninput="recalcTotal()" /></div>
      <div class="form-group"><label>Unit Price (₱) *</label><input id="bill_unit_price" type="number" step="0.01" min="0" placeholder="0.00" oninput="recalcTotal()" /></div>
      <div class="form-group span-2">
        <label>Total</label>
        <div id="bill_total_display" style="font-family:var(--font-serif);font-size:22px;color:var(--green);padding:6px 0">₱0.00</div>
      </div>
    </div>
  `;

  const cancelBtn = el('button', { class: 'btn btn-secondary', onclick: closeModal }, 'Cancel');
  const saveBtn = el('button', { class: 'btn btn-primary', onclick: submitAddInvoice }, 'Create Invoice');

  setState({ modal: buildModal('New Invoice', 'Create a billing record', form, [cancelBtn, saveBtn]) });
}

window.onProductSelect = function() {
  const sel = document.getElementById('bill_product_code');
  const opt = sel.options[sel.selectedIndex];
  const price = opt?.getAttribute('data-price');
  if (price) {
    document.getElementById('bill_unit_price').value = parseFloat(price).toFixed(2);
    recalcTotal();
  }
};

window.recalcTotal = function() {
  const qty = parseFloat(document.getElementById('bill_quantity')?.value) || 0;
  const price = parseFloat(document.getElementById('bill_unit_price')?.value) || 0;
  const total = qty * price;
  const el = document.getElementById('bill_total_display');
  if (el) el.textContent = '₱' + total.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

async function submitAddInvoice() {
  const g = id => document.getElementById(id)?.value.trim() || null;
  if (!g('bill_patient_number') || !g('bill_product_code') || !g('bill_unit_price') || !g('bill_payment_method')) {
    toast('Please fill in all required fields', 'error'); return;
  }

  const payload = {
    patient_number: g('bill_patient_number'),
    product_code: g('bill_product_code'),
    quantity: parseInt(g('bill_quantity')) || 1,
    unit_price: parseFloat(g('bill_unit_price')),
    payment_method: g('bill_payment_method'),
  };

  try {
    const res = await apiFetch('/billing/', { method: 'POST', body: JSON.stringify(payload) });
    closeModal();
    toast(`Invoice ${res.invoice_number} created — Total: ${fmtMoney(res.total)}`);
    setState({ billing: null, inventory: null, dashboard: null });
    loadBilling();
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  }
}

/* ─────────────────────────────────────────────
   MAIN RENDER
───────────────────────────────────────────── */
const PAGE_META = {
  dashboard:   { label: 'Dashboard',    sub: 'Overview & summary' },
  patients:    { label: 'Patients',     sub: 'Patient records & examination' },
  prescriptions:{ label: 'Prescriptions', sub: 'Optical prescriptions' },
  inventory:   { label: 'Inventory',    sub: 'Stock management' },
  billing:     { label: 'Billing',      sub: 'Invoices & payments' },
};

const NAV_ITEMS = [
  { id: 'dashboard',    label: 'Dashboard',     icon: 'dashboard' },
  { id: 'patients',     label: 'Patients',      icon: 'patients' },
  { id: 'prescriptions',label: 'Prescriptions', icon: 'rx' },
  { id: 'inventory',    label: 'Inventory',     icon: 'inventory' },
  { id: 'billing',      label: 'Billing',       icon: 'billing' },
];

function renderApp() {
  const root = document.getElementById('root');
  root.innerHTML = '';

  // Sidebar
  const sidebar = el('aside', { class: 'sidebar' });
  const brand = el('div', { class: 'sidebar-brand' });
  brand.innerHTML = `<h1>Bautro Optical</h1><span>Clinic Management</span>`;

  const nav = el('nav', { class: 'sidebar-nav' });
  for (const item of NAV_ITEMS) {
    const navItem = el('div', { class: 'nav-item' + (state.page === item.id ? ' active' : ''), onclick: () => navigate(item.id) });
    navItem.innerHTML = icons[item.icon] + `<span>${item.label}</span>`;
    nav.appendChild(navItem);
  }

  const foot = el('div', { class: 'sidebar-footer' });
  foot.innerHTML = `<span>v1.0.0 · Bautro Optical Clinic</span>`;

  sidebar.append(brand, nav, foot);

  // Main area
  const main = el('div', { class: 'main' });

  const meta = PAGE_META[state.page] || {};
  const topbar = el('div', { class: 'topbar' });
  topbar.innerHTML = `
    <div class="topbar-left">
      <div class="topbar-title">${meta.label || state.page}</div>
      <div class="topbar-sub">${meta.sub || ''}</div>
    </div>
  `;

  const content = el('div', { class: 'content' });
  let pageContent;
  switch (state.page) {
    case 'dashboard':     pageContent = renderDashboard(); break;
    case 'patients':      pageContent = renderPatients(); break;
    case 'prescriptions': pageContent = renderPrescriptions(); break;
    case 'inventory':     pageContent = renderInventory(); break;
    case 'billing':       pageContent = renderBilling(); break;
    default:              pageContent = el('div', {}, 'Page not found');
  }
  content.appendChild(pageContent);
  main.append(topbar, content);

  root.append(sidebar, main);

  // Modal
  if (state.modal) {
    root.appendChild(state.modal);
  }

  // Toasts
  const toastContainer = el('div', { class: 'toast-container' });
  for (const t of toasts) {
    const toast = el('div', { class: `toast ${t.type}` }, t.msg);
    toastContainer.appendChild(toast);
  }
  root.appendChild(toastContainer);
}

function navigate(page) {
  setState({ page });
  // Eager load if not yet loaded
  if (page === 'dashboard' && !state.dashboard) loadDashboard();
  if (page === 'patients' && !state.patients) loadPatients();
  if (page === 'prescriptions' && !state.prescriptions) loadPrescriptions();
  if (page === 'inventory' && !state.inventory) loadInventory();
  if (page === 'billing' && !state.billing) loadBilling();
}

// Boot
renderApp();
loadDashboard();
</script>
